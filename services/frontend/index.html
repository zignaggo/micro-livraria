<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Micro Livraria</title>
        <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet" />
        <link rel="stylesheet" href="https://unpkg.com/bulma@0.9.0/css/bulma.min.css" />
        <link rel="stylesheet" type="text/css" href="index.css" />
        <link rel="stylesheet" href="https://unpkg.com/bulma-modal-fx/dist/css/modal-fx.min.css" />
    </head>
    <body>
        <section class="hero is-info is-small">
            <div class="hero-body">
                <div class="container">
                    <div class="level">
                        <div class="level-item">
                            <p class="title">Micro Livraria</p>
                        </div>
                        <div class="level-right">
                            <div class="level-item">
                                <button class="button is-light" id="cart-button">
                                    <span class="icon">
                                        <i>🛒</i>
                                    </span>
                                    <span>Carrinho</span>
                                    <span class="tag is-success" id="cart-count">0</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <div class="box cta">
            <p class="has-text-centered">Uma simples livraria utilizando microservices</p>
        </div>
        <section class="container">
            <div class="columns books"></div>
        </section>

        <!-- Modal do Carrinho -->
        <div id="cart-modal" class="modal">
            <div class="modal-background"></div>
            <div class="modal-card">
                <header class="modal-card-head">
                    <p class="modal-card-title">Meu Carrinho</p>
                    <button class="delete" aria-label="close" id="close-cart"></button>
                </header>
                <section class="modal-card-body" id="cart-items">
                    <p class="has-text-centered">Carrinho vazio</p>
                </section>
                <footer class="modal-card-foot">
                    <div style="width: 100%;">
                        <div class="level">
                            <div class="level-left">
                                <div class="level-item">
                                    <strong>Total: R$ <span id="cart-total">0.00</span></strong>
                                </div>
                            </div>
                            <div class="level-right">
                                <div class="level-item">
                                    <button class="button is-danger" id="clear-cart">Limpar Carrinho</button>
                                </div>
                                <div class="level-item">
                                    <button class="button is-success" id="checkout-cart">Finalizar Compra</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>

        <footer class="footer has-text-centered">Feito com ❤️ na UFMG</footer>

        <script src="https://unpkg.com/bulma-modal-fx/dist/js/modal-fx.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/overlayscrollbars/1.9.1/js/OverlayScrollbars.min.js"></script>
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script src="index.js"></script>
    </body>
</html>
